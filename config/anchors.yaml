# Reconciliation anchors (Equal Path rev 2, section 8.1): national, cooperation-area and
# unit-level figures verified during preparation. Counts must sum back to national totals;
# shares are compared like for like at the stated level, within the frozen tolerances.
# A point figure uses `value`; a published range or bound uses `low` / `high`.
- id: new_cancers_2024
  label: "New cancers in Finland"
  value: 38853
  unit: count
  period: "2024"
  level: national
  source_id: S_SYOPA2024_PRESS
  note: ""
  reconcile: {indicator_id: cancer_incidence, period: "2024", method: sum}
- id: cancer_deaths_2024
